name: Daily content state sync

on:
  workflow_dispatch:
  schedule:
    # 08:00 Asia/Seoul = 23:00 UTC (previous day)
    - cron: "0 23 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger daily sync
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$APP_BASE_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --retry 3 --retry-delay 5 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_BASE_URL%/}/api/cron/daily"
