name: Daily prompt and content state sync

on:
  workflow_dispatch:
  schedule:
    # 05:17 Asia/Seoul = 20:17 UTC (previous day)
    - cron: "17 20 * * *"

jobs:
  sync:
    # Scheduled runs are opt-in; manual Preview remains available.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.DAILY_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate daily prompt and sync state
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test -n "$APP_BASE_URL"
          test -n "$CRON_SECRET"

          endpoint="${APP_BASE_URL%/}/api/cron/daily"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            endpoint="${endpoint}?preview=v5"
          fi

          curl --fail-with-body --retry 3 --retry-delay 5 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$endpoint"
